<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUXILIO — BRAZZARCHIVE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .panel {
            width: 100%; max-width: 375px;
            background: linear-gradient(145deg, #0c0c0c, #1a1a1a);
            border-radius: 22px;
            padding: 32px 24px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 0 30px rgba(0, 122, 255, 0.15);
        }
        .cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .titulo { font-size: 28px; font-weight: 800; background: linear-gradient(90deg, #fff, #00a2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .version { font-size: 12px; color: #666; border: 1px solid #2a2a2a; padding: 4px 10px; border-radius: 12px; background: #151515; }

        .caja-estado {
            background: linear-gradient(180deg, #141414, #1a1a1a);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 28px;
            border: 1px solid #222;
            transition: all 0.4s ease;
        }
        .caja-estado.borde-activo { border-color: #00a2ff; box-shadow: 0 0 20px rgba(0, 162, 255, 0.4); background: linear-gradient(180deg, #141414, #1c2c3c); }
        .etiqueta-sistema { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .texto-estado { font-size: 18px; font-weight: 600; color: #666; transition: all 0.4s; }
        .texto-estado.activo { color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.5); }
        .punto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #444; margin-right: 8px; transition: all 0.4s; }
        .punto.activo { background: #00ff88; box-shadow: 0 0 12px #00ff88; animation: pulso 1.2s infinite; }
        @keyframes pulso {
            0% { box-shadow: 0 0 12px #00ff88; }
            50% { box-shadow: 0 0 20px #00ff88, 0 0 30px rgba(0,255,136,0.4); }
            100% { box-shadow: 0 0 12px #00ff88; }
        }

        .opcion { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #1a1a1a; }
        .nombre-opcion { font-size: 16px; color: #ddd; }
        .interruptor {
            width: 51px; height: 29px; background: #2a2a2a; border-radius: 15px; position: relative; transition: all 0.3s ease;
        }
        .interruptor.encendido { background: linear-gradient(180deg, #00a2ff, #0077cc); }
        .bola {
            position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; background: #000; border-radius: 50%; transition: transform 0.3s ease;
        }
        .interruptor.encendido .bola { transform: translateX(22px); background: #fff; }

        .zona-fov { margin-top: 24px; margin-bottom: 28px; }
        .etiqueta-fov { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .nombre-fov { font-size: 15px; color: #ddd; }
        .valor-fov { font-size: 15px; color: #00ff88; font-weight: 700; }
        .barra-fov {
            width: 100%; height: 7px; background: #222; border-radius: 4px; outline: none;
            -webkit-appearance: none; appearance: none;
        }
        .barra-fov.activa { background: linear-gradient(90deg, #0099ff, #00ff88); }
        .barra-fov::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px; background: #fff; border-radius: 50%; border: 2px solid #00a2ff;
        }

        .boton-principal {
            width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.4s ease;
            background: linear-gradient(180deg, #fff, #e0e0e0); color: #000;
        }
        .boton-principal.cargando { background: linear-gradient(180deg, #333, #2a2a2a); color: #888; cursor: not-allowed; animation: cargando 1s infinite; }
        @keyframes cargando { 0%{opacity:1} 50%{opacity:0.7} 100%{opacity:1} }
        .boton-principal.terminado { background: linear-gradient(180deg, #00aa55, #008844); color: #fff; }

        /* === VENTANA DE PERMISO REAL === */
        .caja-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: linear-gradient(180deg, #1c1c1e, #252528); border-radius: 16px; padding: 26px; width: 90%; max-width: 340px;
            border: 1px solid #3a3a3c; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .caja-modal.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        .titulo-modal { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 8px; color: #fff; }
        .subtitulo-modal { font-size: 14px; color: #999; text-align: center; margin-bottom: 20px; line-height: 1.5; }
        
        .input-archivos { display: none; }
        
        .boton-permitir {
            width: 100%; padding: 14px;
            background: linear-gradient(180deg, #007AFF, #0055dd); color: #fff; border: none;
            border-radius: 10px; font-size: 17px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }
        .boton-permitir:hover { background: linear-gradient(180deg, #0088FF, #0066ee); transform: translateY(-1px); }
        
        .area-archivos {
            background: #2c2c2e; border-radius: 10px; padding: 16px; margin-bottom: 14px;
            border: 1px solid #3a3a3c; min-height: 60px; display: none;
        }
        .area-archivos.mostrar { display: block; }
        .texto-seleccion { font-size: 14px; color: #aaa; text-align: center; margin-bottom: 10px; }
        .lista-seleccionados { margin-top: 8px; }
        .archivo-seleccionado {
            padding: 8px 10px; background: #1c1c1e; border-radius: 6px; margin-bottom: 6px;
            font-size: 14px; color: #00ff88; border-left: 3px solid #00ff88;
        }
        
        .boton-seleccionar {
            width: 100%; padding: 12px; background: #2a2a2a; color: #fff; border: 1px solid #444;
            border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 14px;
            display: none;
        }
        .boton-seleccionar.mostrar { display: block; }
        .boton-seleccionar:hover { background: #333; border-color: #00a2ff; }
        
        .boton-continuar {
            width: 100%; padding: 13px;
            background: #333; color: #666; border: none;
            border-radius: 10px; font-size: 17px; font-weight: 600;
            cursor: not-allowed; transition: all 0.2s;
        }
        .boton-continuar.activo {
            background: #007AFF; color: #fff; cursor: pointer;
        }
        .boton-continuar.activo:hover { background: #0088FF; }

        .pie { text-align: center; margin-top: 20px; font-size: 11px; color: #444; }
    </style>
</head>
<body>

<div class="panel" id="panelPrincipal">
    <div class="cabecera">
        <h1 class="titulo">AUXILIO</h1>
        <span class="version">FREE v1.0</span>
    </div>

    <div class="caja-estado" id="cajaEstado">
        <div class="etiqueta-sistema">SYSTEM STATUS</div>
        <div class="texto-estado" id="textoEstado"><span class="punto"></span>DESACTIVADO</div>
    </div>

    <div class="opcion">
        <span class="nombre-opcion">Aimbot</span>
        <div class="interruptor" id="swAimbot"><div class="bola"></div></div>
    </div>
    <div class="opcion">
        <span class="nombre-opcion">Precision</span>
        <div class="interruptor" id="swPrecision"><div class="bola"></div></div>
    </div>
    <div class="opcion">
        <span class="nombre-opcion">No recoil</span>
        <div class="interruptor" id="swNoRecoil"><div class="bola"></div></div>
    </div>
    <div class="opcion">
        <span class="nombre-opcion">headshot</span>
        <div class="interruptor" id="swHeadshot"><div class="bola"></div></div>
    </div>

    <div class="zona-fov">
        <div class="etiqueta-fov">
            <span class="nombre-fov">FOV</span>
            <span class="valor-fov" id="valorFov">0</span>
        </div>
        <input type="range" class="barra-fov" id="barraFov" min="0" max="360" value="0" oninput="document.getElementById('valorFov').textContent=this.value; this.classList.toggle('activa', this.value>0)">
    </div>

    <button class="boton-principal" id="botonPrincipal" onclick="iniciar()">ACTIVAR AUXILIO DE MIRA</button>

    <div class="pie">AUXILIO DE MIRA · BRAZZARCHIVE</div>
</div>

<!-- === VENTANA DE PERMISO REAL === -->
<div class="caja-modal" id="modalArchivos">
    <h3 class="titulo-modal">Permiso de Acceso</h3>
    <p class="subtitulo-modal">Se necesita acceso a los archivos del dispositivo para cargar los componentes del sistema.<br>¿Permitir acceso a archivos?</p>
    
    <!-- PASO 1: BOTÓN DE PERMISO -->
    <button class="boton-permitir" id="btnPermitir" onclick="pedirPermiso()">✅ Permitir Acceso a Archivos</button>
    
    <!-- PASO 2: SELECCIÓN DE ARCHIVOS (aparece DESPUÉS de permitir) -->
    <div class="area-archivos" id="areaArchivos">
        <p class="texto-seleccion" id="textoSeleccion">Ningún archivo seleccionado</p>
        <div class="lista-seleccionados" id="listaArchivos"></div>
    </div>

    <input type="file" id="selectorArchivos" class="input-archivos" multiple>
    
    <button class="boton-seleccionar" id="btnSeleccionar" onclick="document.getElementById('selectorArchivos').click()">📁 Seleccionar Archivos</button>
    
    <button class="boton-continuar" id="btnContinuar" onclick="continuar()">Continuar</button>
</div>

<script>
let archivosElegidos = [];
let permisoOtorgado = false;

// PASO 1 — ACTIVAR → MOSTRAR PERMISO
function iniciar() {
    const boton = document.getElementById('botonPrincipal');
    boton.classList.add('cargando');
    boton.textContent = 'ACTIVANDO...';

    document.querySelectorAll('.interruptor').forEach(sw => sw.classList.add('encendido'));
    document.getElementById('barraFov').value = 360;
    document.getElementById('barraFov').classList.add('activa');
    document.getElementById('valorFov').textContent = '360';
    document.getElementById('textoEstado').innerHTML = '<span class="punto"></span>ACTIVANDO...';

    setTimeout(() => {
        document.getElementById('modalArchivos').classList.add('visible');
    }, 1000);
}

// PASO 2 — DAR PERMISO → APARECE SELECCIÓN
function pedirPermiso() {
    permisoOtorgado = true;
    
    // Ocultar botón de permiso
    document.getElementById('btnPermitir').style.display = 'none';
    
    // Mostrar área de selección
    document.getElementById('areaArchivos').classList.add('mostrar');
    document.getElementById('btnSeleccionar').classList.add('mostrar');
    
    // Abrir el selector de archivos DE VERDAD
    setTimeout(() => {
        document.getElementById('selectorArchivos').click();
    }, 300);
}

// ESCUCHAR CUANDO ELIGES ARCHIVOS REALES
document.getElementById('selectorArchivos').addEventListener('change', function(e) {
    archivosElegidos = Array.from(e.target.files);
    const lista = document.getElementById('listaArchivos');
    const texto = document.getElementById('textoSeleccion');
    const btnCont = document.getElementById('btnContinuar');
    
    lista.innerHTML = '';
    
    if (archivosElegidos.length > 0) {
        texto.textContent = `Se seleccionaron ${archivosElegidos.length} archivo(s):`;
        archivosElegidos.forEach(arch => {
            const div = document.createElement('div');
            div.className = 'archivo-seleccionado';
            div.textContent = '📄 ' + arch.name;
            lista.appendChild(div);
        });
        btnCont.classList.add('activo');
        btnCont.textContent = '✅ Continuar';
    } else {
        texto.textContent = 'Ningún archivo seleccionado';
        btnCont.classList.remove('activo');
        btnCont.textContent = 'Continuar';
    }
});

// PASO 3 — CONTINUAR → INYECTANDO → ABRIR JUEGO
function continuar() {
    if (archivosElegidos.length === 0) return;

    document.getElementById('modalArchivos').classList.remove('visible');

    const boton = document.getElementById('botonPrincipal');
    boton.textContent = 'INYECTANDO...';

    setTimeout(() => {
        const cajaEstado = document.getElementById('cajaEstado');
        const textoEstado = document.getElementById('textoEstado');
        
        cajaEstado.classList.add('borde-activo');
        textoEstado.innerHTML = '<span class="punto activo"></span>ACTIVADO';
        textoEstado.classList.add('activo');
        boton.classList.remove('cargando');
        boton.classList.add('terminado');
        boton.textContent = 'INYECTADO! ✅';

        setTimeout(() => {
            window.location.href = "intent://com.dts.freefireth/#Intent;package=com.dts.freefireth;end";
        }, 800);
    }, 1200);
}
</script>
</body>
</html>
